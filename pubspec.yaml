name: aqar_app
description: "تطبيق عقار - منصة شاملة لإدارة العقارات"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Firebase
  firebase_core: ^3.2.0
  firebase_auth: ^5.1.1
  cloud_firestore: ^5.0.2
  firebase_storage: ^12.1.0
  firebase_analytics: ^11.1.0
  firebase_app_check: ^0.3.0+2
  firebase_messaging: ^15.0.1

  # UI Components
  google_fonts: ^6.2.1
  flex_color_scheme: ^8.3.1
  shimmer: ^3.0.0
  flutter_animate: ^4.5.0
  cached_network_image: ^3.3.1
  curved_navigation_bar: ^1.0.3
  carousel_slider: ^5.1.1
  photo_view: ^0.15.0
  flutter_rating_bar: ^4.0.1
  badges: ^3.1.2
  extended_image: ^10.0.1

  # Maps & Location
  google_maps_flutter: ^2.14.0
  geolocator: ^12.0.0
  geocoding: ^4.0.0
  flutter_polyline_points: ^2.0.0
  google_maps_cluster_manager_2: ^3.0.0+1

  # Media & Files
  image_picker: ^1.2.1
  video_player: ^2.10.1
  chewie: ^1.13.0
  flutter_image_compress: ^2.4.0

  # Forms & Validation
  flutter_form_builder: ^10.2.0
  form_builder_validators: ^11.2.0
  flutter_login: ^5.0.0

  # Storage & Data
  shared_preferences: ^2.3.2
  sqflite: ^2.4.2
  path_provider: ^2.1.5
  path: ^1.9.0

  # Network & Connectivity
  http: ^1.2.0
  connectivity_plus: ^7.0.0
  web_socket_channel: ^3.0.1
  url_launcher: ^6.3.2

  # Utilities
  intl: ^0.20.2
  provider: ^6.1.5+1
  share_plus: ^10.0.0
  cloudinary_public: ^0.23.1
  google_sign_in: ^6.2.1
  flutter_local_notifications: ^17.2.1
  app_links: ^6.4.1
  flutter_native_splash: ^2.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1
  change_app_package_name: ^1.1.0
flutter:
  uses-material-design: true

  assets:
    - assets/logo.png
    - images/aqar_plus_b.jpg
    - images/aqar_plus_bn.jpg
    - images/aqar_plus_gr.jpg
    - images/aqar_gr_log.jpg

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "images/aqar_plus_bn.jpg"
  min_sdk_android: 21

flutter_native_splash:
  color: "#FFFFFF"
  image: images/aqar_plus_bn.jpg
  android: true
  ios: true
  web: false
